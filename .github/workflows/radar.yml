name: Radar Normativo Diario

on:
  schedule:
    - cron: '0 6 * * *' # Ejecuta todos los días a las 06:00 UTC (07:00/08:00 CET)
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Límite estricto para evitar jobs colgados

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias del motor
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Ejecutar radar y prefiltro
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python engine/scrapers/runner.py

      - name: Ejecutar export público a Git
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          python engine/export_public_data.py

      - name: Commit y push de datos públicos actualizados
        run: |
          git config --global user.name "Slowvan Radar Bot"
          git config --global user.email "radar@slowvan.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): daily public dataset export [skip ci]" && git push)
